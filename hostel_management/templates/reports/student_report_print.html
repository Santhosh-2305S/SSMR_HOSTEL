<!DOCTYPE html>
<html>

<head>

    <title>Student Report</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            margin:40px;
        }

        h2{
            text-align:center;
        }

        @media print{

            .no-print{
                display:none;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <h2>SSMR MENS PG</h2>

    <h4 class="text-center mb-4">

        Student Report

    </h4>

    <button
        onclick="window.print()"
        class="btn btn-primary no-print mb-3">

        🖨 Print Report

    </button>

    <table class="table table-bordered">

        <thead class="table-dark">

            <tr>

                <th>Name</th>

                <th>Room</th>

                <th>Bed</th>

                <th>Phone</th>

            </tr>

        </thead>

        <tbody>

        {% for student in students %}

            <tr>

                <td>{{ student.name }}</td>

                <td>{{ student.room.room_number }}</td>

                <td>{{ student.bed.bed_number }}</td>

                <td>{{ student.phone }}</td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>

</html>
