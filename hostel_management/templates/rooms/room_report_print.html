<!DOCTYPE html>
<html>

<head>

    <title>Room Report</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            margin:30px;
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        table,
        th,
        td{
            border:1px solid #000;
        }

        th,
        td{
            padding:8px;
            text-align:center;
        }

        th{
            background:#f2f2f2;
        }

    </style>

</head>

<body onload="window.print()">

    <h2>Room Report</h2>

    <table>

        <thead>

            <tr>

                <th>Room No</th>

                <th>Room Type</th>

                <th>Sharing</th>

                <th>Total Beds</th>

                <th>Available Beds</th>

                <th>Monthly Rent</th>

            </tr>

        </thead>

        <tbody>

            {% for room in rooms %}

            <tr>

                <td>{{ room.room_number }}</td>

                <td>{{ room.room_type }}</td>

                <td>{{ room.sharing_type }}</td>

                <td>{{ room.total_beds }}</td>

                <td>{{ room.available_beds }}</td>

                <td>₹{{ room.monthly_rent }}</td>

            </tr>

            {% empty %}

            <tr>

                <td colspan="6">

                    No Rooms Available

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</body>

</html>
