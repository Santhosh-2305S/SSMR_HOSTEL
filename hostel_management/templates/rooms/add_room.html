{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <h2>Add Room</h2>

    <form method="POST">

        {% csrf_token %}

        <div class="row">

            {% for field in form %}

            <div class="col-md-6 mb-3">

                <label class="form-label">{{ field.label }}</label>

                {{ field }}

                {% if field.errors %}
                <div class="text-danger small">
                    {{ field.errors }}
                </div>
                {% endif %}

            </div>

            {% endfor %}

        </div>

        <button type="submit" class="btn btn-primary">
            Save Room
        </button>

        <a href="{% url 'room_list' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
